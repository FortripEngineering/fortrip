# Publishes @fortrip/agent-contract and fortrip to npm, in lockstep, when a
# vX.Y.Z or vX.Y.Z-rc.N tag is pushed: both packages' versions must equal the
# tag. A release candidate (-rc.N) is published under the "next" dist-tag, so
# it never becomes what `npm install` resolves. Authenticates with npm trusted
# publishing (OIDC): no npm token is stored in GitHub. npmjs.com must list this
# file's name, publish.yml, as the trusted publisher of both packages.
#
# The build job checks, tests and packs the tarballs without any publish
# permission; the publish job only uploads those tarballs, so the OIDC token
# never shares a job with dependency install scripts or the build.
name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check the tag matches both packages' versions
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          for package in contract cli; do
            version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/${package}/package.json version ${version}"
              exit 1
            fi
          done

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Pack the contract
        working-directory: packages/contract
        run: npm pack --ignore-scripts --pack-destination ../..

      - name: Pack the CLI
        working-directory: packages/cli
        run: npm pack --ignore-scripts --pack-destination ../..

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: fortrip-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Node 24 ships npm 11, which trusted publishing needs (>= 11.5.1).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # The tarballs the build job tested, as is. The contract goes first, so a
      # CLI that depends on it can resolve it. A release candidate gets the
      # "next" dist-tag. A package whose version is already on npm is skipped,
      # so re-running the job after a partial publish finishes the release.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "${version}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          contract="./fortrip-agent-contract-${version}.tgz"
          cli="./fortrip-${version}.tgz"
          for tarball in "${contract}" "${cli}"; do
            if [ ! -f "${tarball}" ]; then
              echo "::error::${tarball} is missing from the build's artifact"
              exit 1
            fi
          done

          # Succeeds when name@version is on npm and fails when it is not. A
          # 404 means "not published"; any other npm error fails the job. Only
          # errors are logged, so an npm warning can't pass for the version.
          is_published() {
            local out status=0
            out="$(npm view --loglevel=error "$1@${version}" version 2>&1)" || status=$?
            if [ "${status}" -eq 0 ] && [ "${out}" = "${version}" ]; then
              return 0
            fi
            if [ "${status}" -ne 0 ] && [[ "${out}" == *"code E404"* ]]; then
              return 1
            fi
            echo "::error::npm view $1@${version} did not answer published or not published: ${out}"
            exit 1
          }

          # Decide both before publishing either, so a failed lookup never
          # leaves a release half done.
          to_publish=()
          if is_published "@fortrip/agent-contract"; then
            echo "::notice::@fortrip/agent-contract@${version} is already on npm; skipping it"
          else
            to_publish+=("${contract}")
          fi
          if is_published "fortrip"; then
            echo "::notice::fortrip@${version} is already on npm; skipping it"
          else
            to_publish+=("${cli}")
          fi

          for tarball in "${to_publish[@]}"; do
            npm publish --ignore-scripts --tag "${dist_tag}" "${tarball}"
          done
