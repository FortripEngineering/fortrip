# Typecheck, tests and build of the packages, and the store listings' checks,
# for pull requests and pushes to main.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # The oldest Node the package supports, and the one releases build on.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  listings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # scripts/validate.mjs covers the OpenAI package, the MCP Registry entry
      # and repo-wide rules; Claude Code's own validator covers the Claude
      # marketplace, plugin and skills.
      - run: pnpm validate

      - run: npm install --global @anthropic-ai/claude-code@2.1.292
      - name: Claude marketplace, plugin and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/claude
          claude plugin validate --strict skills
