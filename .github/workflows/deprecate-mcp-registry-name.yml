# One-off: run once, after "Publish Fortrip to MCP Registry" has published
# io.github.FortripEngineering/fortrip, then delete this file.
name: Deprecate fortrip-hotels in MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install official MCP publisher
        run: |
          curl --fail --location --silent --show-error --retry 3 --output mcp-publisher_linux_amd64.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Deprecate the old server name
        run: ./mcp-publisher status --status deprecated --message "Renamed to io.github.FortripEngineering/fortrip" --all-versions --yes io.github.FortripEngineering/fortrip-hotels
