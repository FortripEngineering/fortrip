# Deploys docs.fortrip.ai to Vercel when a docs-* tag is pushed. Production
# docs follow the live server, not main, so deploying is a deliberate act: the
# tag name is free-form (docs-4.3.0, or docs-4.3.0-2 for a docs-only fix cut
# from a v* tag), the guard refuses a prerelease contract, and a human approves
# the docs-production environment, which holds VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID. The v* filter of publish.yml cannot match docs-* tags
# (tag filters are globs anchored at the start), so this never publishes to npm.
#
# The build runs here, from the repo root, so the Vercel project's Root
# Directory (packages/docs) applies and the whole monorepo is present: the docs
# read packages/contract and packages/cli/package.json.
name: Deploy docs

on:
  push:
    tags:
      - "docs-*"

permissions: {}

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: docs-production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Refuse a prerelease contract
        run: node --import tsx scripts/docs-deploy-guard.ts

      - name: Check the changelog has the contract's entry
        run: node --import tsx scripts/changelog-gate.ts

      - name: Pull the Vercel project settings
        run: npx --yes vercel@65.11.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@65.11.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx --yes vercel@65.11.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
