name: Publish Fortrip to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install official MCP publisher
        run: |
          curl --fail --location --silent --show-error --retry 3 --output mcp-publisher_linux_amd64.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Migrate remote MCP listing to the Fortrip name
        run: |
          ./mcp-publisher status --status deleted --all-versions --message "Renamed to io.github.FortripEngineering/fortrip; the MCP endpoint is unchanged." io.github.FortripEngineering/fortrip-hotels
          if ! ./mcp-publisher publish server.json; then
            ./mcp-publisher status --status active --all-versions io.github.FortripEngineering/fortrip-hotels
            exit 1
          fi
